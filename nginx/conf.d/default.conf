server {
  listen 8080;
  server_name _;  # catches all hostnames, replace with your domain later

  # Frontend static files
  location / {
    proxy_pass http://frontend:5173;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # API proxy
  location /api/ {
    proxy_pass http://backend:8090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /chat/ {
    # WebSocket isn't actually a separate protocol from scratch — it starts as HTTP and then upgrades.
    # broswer -> nginx: HTTP request with "Upgrade: websocket" header
    # nginx -> backend: same HTTP request with "Upgrade: websocket" header
    proxy_pass http://backend:8090;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
  }
}