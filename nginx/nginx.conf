user nginx;
worker_processes auto;  # auto scales to CPU cores
# error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;  # max connections per worker
  use epoll;                # most efficient on Linux
  multi_accept on;          # When on, a worker accepts all pending connections at once. Better throughput under load.
}

http {
  include       /etc/nginx/mime.types; # Defines content types, such as text/html or image/jpeg, which tell browsers and email clients how to process data.
  default_type  application/octet-stream; #Fallback MIME type for files not in mime.types. octet-stream means raw binary — tells the browser to download rather than try to render it.


  # Logging
  # currently run using docker with alpine so logs are sent to stdout and handled by docker, but this is here for reference if we want to switch to file logging in the future
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # Performance
  sendfile        on; # Lets the OS kernel send files directly to the network socket without copying through userspace. Much faster for serving static files.
  tcp_nopush      on; # Batches response headers and the start of the file into one packet. Works with sendfile to reduce network overhead.
  tcp_nodelay     on; # Disables Nagle's algorithm — sends packets immediately rather than buffering. Important for low latency, especially WebSockets.
  keepalive_timeout 65;
  gzip on; # Compresses responses before sending, no point compressing already-compressed formats like images.
  gzip_types text/plain application/json application/javascript text/css;

  # additional config defined in the conf.d directory, such as reverse proxy settings for the API and WebSocket
  include /etc/nginx/conf.d/*.conf;
}